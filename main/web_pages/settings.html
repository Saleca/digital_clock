<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relogio</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <nav class="nav-bar">
        <button class="bar-push-right home"  onclick="navigate('home')">
            <img src="favicon.svg" alt="Home" width="64" height="64">
        </button>
        <button class="btn-nav btn-border-left" onclick="navigate('home')">Relógio</button>
        <button class="btn-nav active btn-border-middle" onclick="navigate('settings')">Definições</button>
        <button class="btn-nav btn-border-right" onclick="navigate('update')">Update</button>
    </nav>

    <h1>Settings</h1>
    <!--check if is connected via STA or AP-->
        <p>introduz as credenciais da wifi</p>
    
    <section>
        <h2>Wi-fi</h2>
        <label>ssid</label>
        <input type="text" id="wifi-ssid" placeholder="network name" /> <!-- add current ssid for placeholder-->
        <label>password</label>
        <div class="password-row">
            <input type="password" id="wifi-pass" />
            <button onclick="toggle_password_visibility(this, 'wifi-pass')" type="button">Ver</button>
        </div>
        <button class="btn-p" onclick="save('wifi')">Guardar</button>
        <div class="feedback" id="fb-wifi"></div>
    </section>

    <section>
        <h2>mDNS</h2>
        <label>hostname</label>
        <input type="text" id="mdns-host" placeholder="relogio-sala" />
        <p style="font-size:0.78rem;color:#3a5060;margin-bottom:0.75rem;margin-top:-0.25rem">interface teria acesso por
            <span id="mdns-preview">relogio-sala</span>.local
        </p>
        <div class="btn-row">
            <button class="btn-p" onclick="save('mdns')">Guardar</button>
        </div>
        <div class="feedback" id="fb-mdns"></div>
    </section>

    <script src="settings.js" defer></script>
</body>

</html>
