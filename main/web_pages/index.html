<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relogio</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <nav class="nav-bar">
        <button class="nav-home" onclick="navigate('home')">
            <img src="favicon.svg" alt="Home" width="64" height="64">
        </button>
        <button class="btn-nav selected btn-border-left" onclick="navigate('home')">Relógio</button>
        <button class="btn-nav btn-border-middle" onclick="navigate('settings')">Definições</button>
        <button class="btn-nav btn-border-right" onclick="navigate('update')">Update</button>
    </nav>

    <h1>Relógio</h1>
    <p>Escolhe a cor dos ponteiros, ajusta o brilho, pré-visualiza no dispositivo e guarda.</p>

    <div id="colour-cards"></div>

    <div class="checkbox-row">
        <input type="checkbox" id="has-seconds" checked>
        <label for="has-seconds">Mostrar ponteiro dos segundos</label>
    </div>

    <div class="slider-block">
        <label>
            <p>Brilho durante o dia</p>
            <p id="day-val">80</p>
        </label>
        <input type="range" id="day-brightness" min="1" max="100" value="80">
    </div>

    <div class="slider-block">
        <label>
            <p>Brilho durante a noite</p>
            <p id="night-val">20</p>
        </label>
        <input type="range" id="night-brightness" min="1" max="100" value="20">
    </div>

    <button id="preview-colours-btn" onclick="preview_colours()">Preview</button>
    <div class="feedback" id="fb-colour"></div>

    <script src="clock_face.js" defer></script>
</body>

</html>
